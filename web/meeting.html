<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>meeting</title>
    <style>
      @font-face {
        font-family: "Inter Variable";
        src: url("https://modal-cdn.com/fonts/inter-variable.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Goga";
        src: url("https://modal-cdn.com/fonts/Goga-VariableVF.woff2") format("woff2");
        font-weight: 100 900;
      }
      :root {
        color-scheme: dark;
        --ground: #181818;
        --elevated: #232323;
        --divider: #272727;
        --heading: #ffffff;
        --primary: #d1d1d1;
        --secondary: #bababa;
        --tertiary: #747474;
        --accent: #7fee64;
        --accent-bg: #1d231c;
        --info: #79a4c4;
        --info-bg: #2a3238;
        --sans: "Inter Variable", ui-sans-serif, system-ui, sans-serif;
        --mono: "Fira Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--ground);
        color: var(--primary);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.5;
      }
      .page {
        max-width: 72rem;
        margin: 0 auto;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        height: 100vh;
      }
      .meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        font-family: var(--mono);
        font-size: 0.75rem;
        color: var(--tertiary);
      }
      .meta .fields { display: flex; flex-direction: column; gap: 0.25rem; }
      .meta label { color: var(--tertiary); }
      .meta .value { color: var(--secondary); }
      .meta a { color: var(--accent); text-decoration: none; }
      .meta a:hover { text-decoration: underline; }
      .spinner {
        margin-right: 0.5rem;
        width: 1rem;
        height: 1rem;
        border: 2px solid var(--divider);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .panes {
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: repeat(4, minmax(0, 1fr));
        gap: 1rem;
        flex: 1;
        min-height: 0;
      }
      @media (min-width: 56rem) {
        .panes { grid-template-columns: 1fr 1fr; grid-template-rows: repeat(2, minmax(0, 1fr)); }
      }
      section {
        background: var(--elevated);
        border: 1px solid var(--divider);
        border-radius: 0.5rem;
        padding: 1rem 1.25rem;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      h2 {
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--tertiary);
        margin: 0 0 0.75rem;
      }
      .entries {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }
      .entry { margin: 0; }
      .entry p, .entry ul, .entry ol { margin: 0; }
      .entry ul, .entry ol { padding-left: 1.25rem; }
      .entry .speaker {
        font-weight: 600;
        color: var(--heading);
      }
      .entry a.shot { display: block; }
      .entry a.shot { display: block; }
      .entry a.shot { display: block; }
      .entry a.shot { display: block; }
      .entry a.shot img { max-height: 6rem; border-radius: 0.25rem; margin-top: 0.25rem; }
      .entry a.shot.loading { height: 6rem; width: 8rem; margin-top: 0.25rem; border-radius: 0.25rem; background: var(--elevated); animation: pulse 1.2s ease-in-out infinite; }
      .entry a.shot.loading img { display: none; }
      .entry a.shot.loading { height: 6rem; width: 8rem; margin-top: 0.25rem; border-radius: 0.25rem; background: var(--elevated); animation: pulse 1.2s ease-in-out infinite; }
      .entry a.shot.loading img { display: none; }
      .entry a.shot.loading { height: 6rem; width: 8rem; margin-top: 0.25rem; border-radius: 0.25rem; background: var(--elevated); animation: pulse 1.2s ease-in-out infinite; }
      .entry a.shot.loading img { display: none; }
      .entry a.shot.loading { height: 6rem; width: 8rem; margin-top: 0.25rem; border-radius: 0.25rem; background: var(--elevated); animation: pulse 1.2s ease-in-out infinite; }
      .entry a.shot.loading img { display: none; }
      .entry .t {
        font-family: var(--mono);
        font-size: 0.75rem;
        color: var(--tertiary);
      }
      .entry.hal .speaker { color: var(--accent); }
      .empty { color: var(--tertiary); font-style: italic; }
      .loading {
        display: inline-block;
        height: 0.75rem;
        border-radius: 0.25rem;
        background: var(--divider);
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse { 50% { opacity: 0.5; } }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="meta">
        <div class="fields">
          <a id="meet" href="#"><span class="loading" style="width: 14rem"></span></a>
          <span><label>Participants:</label> <span id="participants" class="value"><span class="loading" style="width: 10rem"></span></span></span>
          <span>
            <label>Start time:</label> <span id="started" class="value"><span class="loading" style="width: 5rem"></span></span>,
            <label>Elapsed:</label> <span id="elapsed" class="value"><span class="loading" style="width: 2.5rem"></span></span>
          </span>
          <span id="error"></span>
        </div>
        <div id="spinner" class="spinner" hidden></div>
      </div>
      <div class="panes">
        <section>
          <h2>recap</h2>
          <div id="recap" class="entries" role="log" aria-live="polite"><p><span class="loading" style="width: 60%"></span></p></div>
        </section>
        <section>
          <h2>screenshots</h2>
          <div id="screens" class="entries" role="log" aria-live="polite"><p><span class="loading" style="width: 60%"></span></p></div>
        </section>
        <section>
          <h2>transcript</h2>
          <div id="transcript" class="entries" role="log" aria-live="polite"><p><span class="loading" style="width: 60%"></span></p></div>
        </section>
        <section>
          <h2>chat</h2>
          <div id="chat" class="entries" role="log" aria-live="polite"><p><span class="loading" style="width: 60%"></span></p></div>
        </section>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked@16/lib/marked.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <script>
      const md = (text) => DOMPurify.sanitize(marked.parseInline(text || ""));
      let started = 0, ended = 0;
      setInterval(() => {
        if (!started) return;
        const s = Math.max(0, Math.floor((ended || Date.now() / 1000) - started));
        const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
        document.getElementById("elapsed").textContent =
          `${h ? `${h}:${String(m).padStart(2, "0")}` : m}:${String(sec).padStart(2, "0")}`;
      }, 1000);
      const events = new EventSource("events");
      events.onmessage = (event) => {
        const { transcript = [], chat = [], screens = [], ...state } = JSON.parse(event.data);
        const meet = document.getElementById("meet");
        meet.textContent = state.meet;
        meet.href = state.meet;
        document.getElementById("participants").textContent =
          (state.participants || []).join(", ");
        document.getElementById("started").textContent =
          new Date(state.started * 1000).toLocaleTimeString();
        started = state.started;
        document.getElementById("error").textContent =
          state.status === "left" ? "" : state.error || "";
        if (state.status === "left") {
          ended = Math.max(
            state.started,
            ...transcript.concat(chat, screens).map(e => e.t ?? 0)
          );
          document.getElementById("spinner").hidden = true;
        } else {
          document.getElementById("spinner").hidden = false;
        }
        const pane = document.getElementById("recap");
        pane.replaceChildren(Object.assign(document.createElement("p"), {
          className: state.recap ? "entry" : "empty",
          innerHTML: state.recap ? DOMPurify.sanitize(marked.parse(state.recap)) : "nothing yet",
        }));
        for (const [id, entries] of Object.entries({ transcript, chat, screens })) {
          const pane = document.getElementById(id);
          if (!entries.length) {
            pane.replaceChildren(Object.assign(document.createElement("p"), {
              className: "empty", textContent: "nothing yet",
            }));
            continue;
          }
          pane.replaceChildren(...entries.map(entry => {
            const line = document.createElement("p");
            line.className = `entry${entry.speaker === "Hal" ? " hal" : ""}`;
            const text = document.createElement("span");
            text.innerHTML = md(entry.text ?? entry.desc);
            const t = document.createElement("span");
            t.className = "t";
            t.textContent = `[${new Date(entry.t * 1000).toLocaleTimeString()}]`;
            const speaker = document.createElement("span");
            speaker.className = "speaker";
            speaker.textContent = entry.speaker ?? "";
            line.append(t, " ", speaker, entry.speaker ? ": " : " ", text);
            if (id === "screens" && entry.file) {
              const a = document.createElement("a");
              a.href = `/m/${window.location.pathname.split("/")[2]}/${entry.file}`;
              a.className = "shot loading";
              const img = document.createElement("img");
              img.src = a.href;
              img.onload = () => a.classList.remove("loading");
              img.onerror = () => a.remove();
              a.append(img);
              line.append(document.createElement("br"), a);
            }
            return line;
          }));
          pane.scrollTop = pane.scrollHeight;
        }
        if (state.status === "left") events.close();
      };
    </script>
  </body>
</html>

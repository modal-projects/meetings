<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>modal-meetings</title>
    <style>
      @font-face {
        font-family: "Inter Variable";
        src: url("https://modal-cdn.com/fonts/inter-variable.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Goga";
        src: url("https://modal-cdn.com/fonts/Goga-VariableVF.woff2") format("woff2");
        font-weight: 100 900;
      }
      :root {
        color-scheme: dark;
        --ground: #181818;
        --elevated: #232323;
        --divider: #272727;
        --heading: #ffffff;
        --primary: #d1d1d1;
        --secondary: #bababa;
        --tertiary: #747474;
        --accent: #7fee64;
        --sans: "Inter Variable", ui-sans-serif, system-ui, sans-serif;
        --mono: "Fira Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--ground);
        color: var(--primary);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.5;
      }
      .page {
        max-width: 72rem;
        margin: 0 auto;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }
      h1 {
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--tertiary);
        margin: 0;
      }
      .meetings {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .meeting {
        display: flex;
        align-items: center;
        gap: 1rem;
        background: var(--elevated);
        border: 1px solid var(--divider);
        border-radius: 0.5rem;
        padding: 0.75rem 1.25rem;
        text-decoration: none;
      }
      .meeting:hover { border-color: var(--tertiary); }
      .meeting .link {
        font-family: var(--mono);
        font-size: 0.8rem;
        color: var(--accent);
      }
      .meeting .who {
        color: var(--secondary);
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .meeting .when {
        font-family: var(--mono);
        font-size: 0.75rem;
        color: var(--tertiary);
      }
      .meeting .status {
        font-family: var(--mono);
        font-size: 0.75rem;
        color: var(--tertiary);
      }
      .meeting .status.live { color: var(--accent); }
      .empty { color: var(--tertiary); font-style: italic; }
      .skeleton {
        display: flex;
        align-items: center;
        gap: 1rem;
        background: var(--elevated);
        border: 1px solid var(--divider);
        border-radius: 0.5rem;
        padding: 0.75rem 1.25rem;
      }
      .skeleton span {
        display: block;
        height: 0.75rem;
        border-radius: 0.25rem;
        background: var(--divider);
        animation: pulse 1.2s ease-in-out infinite;
      }
      .skeleton .a { width: 12rem; }
      .skeleton .b { width: 8rem; flex: 1; }
      .skeleton .c { width: 6rem; }
      @keyframes pulse { 50% { opacity: 0.5; } }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>meetings</h1>
      <div class="meetings" id="meetings">
        <div class="skeleton"><span class="a"></span><span class="b"></span><span class="c"></span></div>
        <div class="skeleton"><span class="a"></span><span class="b"></span><span class="c"></span></div>
        <div class="skeleton"><span class="a"></span><span class="b"></span><span class="c"></span></div>
      </div>
    </div>
    <script>
      fetch("meetings.json")
        .then((r) => (r.ok ? r.json() : Promise.reject(new Error(`http ${r.status}`))))
        .then((meetings) => {
          const list = document.getElementById("meetings");
          if (!Array.isArray(meetings) || !meetings.length) {
            list.replaceChildren(Object.assign(document.createElement("p"), {
              className: "empty", textContent: "no meetings yet",
            }));
            return;
          }
          list.replaceChildren(...meetings.map((m) => {
            const a = document.createElement("a");
            a.className = "meeting";
            a.href = `/m/${m.id}`;
            const link = document.createElement("span");
            link.className = "link";
            link.textContent = m.meet || "";
            const who = document.createElement("span");
            who.className = "who";
            who.textContent = (m.participants || []).join(", ");
            const when = document.createElement("span");
            when.className = "when";
            when.textContent = m.started
              ? new Date(m.started * 1000).toLocaleString()
              : "";
            const status = document.createElement("span");
            status.className = `status${m.status !== "left" ? " live" : ""}`;
            status.textContent = m.status !== "left" ? "live" : "";
            a.append(link, who, when, status);
            return a;
          }));
        })
        .catch(() => {
          document.getElementById("meetings").replaceChildren(
            Object.assign(document.createElement("p"), {
              className: "empty", textContent: "meetings unavailable",
            }),
          );
        });
    </script>
  </body>
</html>
